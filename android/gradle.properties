org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=1024M -XX:ReservedCodeCacheSize=256M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
# Forked (out-of-process) Kotlin compilation: the compiler gets its own JVM and heap, so a
# compilation OOM can no longer take down the Gradle build. In-process compilation ran the
# compiler inside the Gradle JVM and died with "Failed to commit metaspace"
# (android/hs_err_pid*.log) because this machine's pagefile commit limit is only ~32 GB.
# Run the Kotlin compiler inside the Gradle JVM. Out-of-process spawns a
# second JVM (~2 GB of commit) and on a machine with a tight commit limit
# that is exactly what fails:
#   os::commit_memory(...) failed: The paging file is too small
#   Could not connect to Kotlin compile daemon
kotlin.compiler.execution.strategy=in-process
# Heap cap for the forked Kotlin compiler JVM. This machine's pagefile commit limit is only
# ~32 GB, so the compiler must not be allowed to grow unbounded.
kotlin.daemon.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512M
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
