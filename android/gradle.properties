# --- Gradle memory configuration ---------------------------------------------
# Constraint: this machine has 23.7 GB RAM and a MANUALLY-sized 9.4 GB pagefile,
# giving a system commit limit of ~32.9 GB. The Android release build is
# commit-bound, not CPU-bound: when the limit is reached the Gradle JVM dies with
# a NATIVE allocation failure, not a heap OOM:
#
#   There is insufficient memory for the Java Runtime Environment to continue.
#   Native memory allocation (malloc) failed to allocate 1804816 bytes.
#   Error detail: Chunk::new        (arena.cpp:168)
#
# That is the JIT's own arena failing, so tuning -Xmx alone does not fix it --
# a large heap RESERVES commit that native code then cannot get. Several
# android/hs_err_pid*.log files are this same crash.
#
# Full analysis: .workbuddy-ai/memory/2026-10-02.md

org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=1024M -XX:ReservedCodeCacheSize=256M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel task execution forks additional worker JVMs, each reserving its own
# commit. On a commit-limited machine that is a net loss: this build is a single
# Android app module, so there is little cross-project parallelism to win anyway.
# Serial execution trades wall-clock for a much lower peak.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false

# In-process Kotlin compilation. The alternative (forked/out-of-process) spawns a
# second JVM costing ~2 GB of commit, which on this box fails outright with:
#   os::commit_memory(...) failed: The paging file is too small
#   Could not connect to Kotlin compile daemon
# In-process keeps one JVM, at the cost of a compiler OOM being able to take the
# Gradle build down with it -- acceptable, because we cannot afford the second JVM.
kotlin.compiler.execution.strategy=in-process

# Only used if the strategy above is ever switched back to forked/daemon.
kotlin.daemon.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512M

android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
# Full recompiles instead of incremental: incremental state adds memory and disk
# churn, and correctness is easier to reason about on a machine this tight.
kotlin.incremental=false
# Added automatically by the Flutter migrator.
android.builtInKotlin=false
android.newDsl=false
